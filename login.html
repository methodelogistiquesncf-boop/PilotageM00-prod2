<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Pilotage M00</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f2f0eb;
  --surface: #ffffff;
  --border: #c8c4bc;
  --text: #1a1917;
  --muted: #7a776f;
  --accent: #1a4fa0;
  --accent-dark: #143d80;
  --error: #c03030;
  --error-bg: #fdeaea;
  --success: #1a7a3c;
  --success-bg: #d4f0de;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px 36px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
}

.brand {
  text-align: center;
  margin-bottom: 32px;
}
.brand-icon {
  width: 52px; height: 52px;
  background: var(--accent);
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}
.brand-icon svg { width: 28px; height: 28px; fill: #fff; }
.brand h1 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.brand p  { font-size: 12px; color: var(--muted); }

.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  margin-bottom: 6px;
}
input[type="email"],
input[type="password"],
input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  font-size: 13px;
  font-family: inherit;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
input:focus { border-color: var(--accent); }

.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 40px; }
.pw-toggle {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px;
}
.pw-toggle:hover { color: var(--text); }
.pw-toggle svg { width: 16px; height: 16px; display: block; }

.btn-submit {
  width: 100%;
  padding: 11px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s, opacity .15s;
  margin-top: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-submit:hover  { background: var(--accent-dark); }
.btn-submit:disabled { opacity: .6; cursor: not-allowed; }

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  display: none;
}
.spinner.visible { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

.msg {
  font-size: 12px;
  padding: 10px 12px;
  border-radius: 7px;
  margin-bottom: 16px;
  display: none;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.4;
}
.msg.visible { display: flex; }
.msg.err  { background: var(--error-bg);   color: var(--error);   border: 1px solid #f5c6c6; }
.msg.ok   { background: var(--success-bg); color: var(--success); border: 1px solid #a8dbb8; }

.forgot {
  text-align: right;
  margin-top: -8px;
  margin-bottom: 16px;
}
.forgot a {
  font-size: 11px;
  color: var(--muted);
  text-decoration: none;
  cursor: pointer;
}
.forgot a:hover { color: var(--accent); text-decoration: underline; }

#resetPanel { display: none; }
#resetPanel.visible { display: block; }
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  margin-bottom: 20px;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
}
.back-link:hover { color: var(--accent); }

.footer {
  margin-top: 24px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a4fa0">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/logo.svg">
<script src="version.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      var vEl = document.getElementById('appVersion');
      if (vEl && window.APP_VERSION) vEl.textContent = window.APP_VERSION;

      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;

      navigator.serviceWorker.register('sw.js').then(function (reg) {
        setInterval(function () { reg.update(); }, 60000);
      }).catch(function (e) { console.error('SW :', e); });

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloading) return;
        reloading = true;
        var go = function () { window.location.reload(); };
        if (typeof window.saveFirebase === 'function') {
          Promise.resolve(window.saveFirebase()).then(go).catch(go);
        } else { go(); }
      });
    });
  }
</script>
</head>
<body>

<div class="card">

  <div class="brand">
    <img src="icons/logo.svg" alt="Pilotage M00" style="width:64px;height:64px;margin-bottom:14px">
    <h1>Pilotage M00 Prod2</h1>
    <p>Connectez-vous pour accéder au tableau</p>
  </div>

  <div class="msg" id="globalMsg"></div>

  <!-- ── PANEL LOGIN ── -->
  <div id="loginPanel">
    <div class="form-group">
      <label for="loginEmail">Adresse e-mail</label>
      <input type="email" id="loginEmail" placeholder="prenom.nom@exemple.fr" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="loginPw">Mot de passe</label>
      <div class="pw-wrap">
        <input type="password" id="loginPw" placeholder="••••••••" autocomplete="current-password">
        <button class="pw-toggle" onclick="togglePw('loginPw', this)" type="button" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="forgot"><a onclick="switchTab('reset')">Mot de passe oublié ?</a></div>
    <button class="btn-submit" id="btnLogin" onclick="doLogin()">
      <span class="spinner" id="spinLogin"></span>
      <span id="lblLogin">Se connecter</span>
    </button>
  </div>

  <!-- ── PANEL RESET ── -->
  <div id="resetPanel">
    <button class="back-link" onclick="switchTab('login')">
      ← Retour à la connexion
    </button>
    <div class="form-group">
      <label for="resetEmail">Adresse e-mail</label>
      <input type="email" id="resetEmail" placeholder="prenom.nom@exemple.fr">
    </div>
    <button class="btn-submit" id="btnReset" onclick="doReset()">
      <span class="spinner" id="spinReset"></span>
      <span id="lblReset">Envoyer le lien de réinitialisation</span>
    </button>
  </div>

  <div class="footer">Tableau de bord interne — accès restreint</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDYo1JH1uqYX6OsHdV9QjtaG6CjP9gLQEo",
  authDomain: "pilotagem00-prod2.firebaseapp.com",
  projectId: "pilotagem00-prod2",
  storageBucket: "pilotagem00-prod2.firebasestorage.app",
  messagingSenderId: "66122797161",
  appId: "1:66122797161:web:61468faf9ea1ffaf6cd2f8"
};

const APP_PAGE = 'suivi.html';

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

auth.onAuthStateChanged(user => {
  if (user) window.location.href = APP_PAGE;
});

function switchTab(tab) {
  clearMsg();
  document.getElementById('loginPanel').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('resetPanel').classList.toggle('visible', tab === 'reset');
}

async function doLogin() {
  clearMsg();
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  if (!email || !pw) { showMsg('err', 'Veuillez remplir tous les champs.'); return; }
  setLoading('Login', true);
  try {
    await auth.signInWithEmailAndPassword(email, pw);
    showMsg('ok', '✅ Connexion réussie — redirection…');
    setTimeout(() => window.location.href = APP_PAGE, 800);
  } catch(e) {
    showMsg('err', firebaseError(e.code));
  } finally {
    setLoading('Login', false);
  }
}

async function doReset() {
  clearMsg();
  const email = document.getElementById('resetEmail').value.trim();
  if (!email) { showMsg('err', 'Veuillez saisir votre adresse e-mail.'); return; }
  setLoading('Reset', true);
  try {
    await auth.sendPasswordResetEmail(email);
    showMsg('ok', '📧 E-mail envoyé ! Vérifiez votre boîte de réception (et les spams).');
    document.getElementById('resetEmail').value = '';
  } catch(e) {
    showMsg('err', firebaseError(e.code));
  } finally {
    setLoading('Reset', false);
  }
}

function setLoading(id, on) {
  document.getElementById('btn'+id).disabled = on;
  document.getElementById('spin'+id).classList.toggle('visible', on);
  document.getElementById('lbl'+id).style.display = on ? 'none' : 'inline';
}

function showMsg(type, text) {
  const el = document.getElementById('globalMsg');
  el.className = 'msg visible ' + type;
  el.textContent = text;
}
function clearMsg() {
  const el = document.getElementById('globalMsg');
  el.className = 'msg';
  el.textContent = '';
}

function togglePw(inputId, btn) {
  const inp = document.getElementById(inputId);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

function firebaseError(code) {
  const firebaseConfig = {
  apiKey: "AIzaSyDYo1JH1uqYX6OsHdV9QjtaG6CjP9gLQEo",
  authDomain: "pilotagem00-prod2.firebaseapp.com",
  projectId: "pilotagem00-prod2",
  storageBucket: "pilotagem00-prod2.firebasestorage.app",
  messagingSenderId: "66122797161",
  appId: "1:66122797161:web:61468faf9ea1ffaf6cd2f8"
};
  return map[code] || 'Erreur : ' + code;
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('resetPanel').classList.contains('visible')) doReset();
  else doLogin();
});
</script>
</body>
</html>
